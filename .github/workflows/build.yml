name: Run pi-gen
on: 
  workflow_dispatch:

jobs:
  pi-gen:
    runs-on: ubuntu-latest
    steps:
      - uses: usimd/pi-gen-action@v1.10.0
        id: build
        with:
          pi-gen-repository: mikysal78/pi-gen-ninux
          image-name: ninuxberry
          stage-list: stage0 stage1 stage2
          verbose-output: true
          enable-noobs: true
          compression: zip
          compression-level: 9
          locale: it_IT.UTF-8
          hostname: ninuxberry
          keyboard-keymap: it
          keyboard-layout: Italiana
          username: ninux
          wpa-essid: ninux-org
          wpa-password: 'ninux2025'
          timezone: Europe/Rome
          export-last-stage-only: false

      - run: tree 
      
      - uses: actions/upload-artifact@v4
        with:
          name: pi-gen-image
          path: ${{ steps.build.outputs.image-path }}
          retention-days: 2
      
      - uses: actions/upload-artifact@v4
        with:
          name: pi-gen-noobs-image
          path: ${{ steps.build.outputs.image-noobs-path }}
          retention-days: 2
