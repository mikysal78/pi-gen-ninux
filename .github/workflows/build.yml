name: Run pi-gen
on: 
  workflow_dispatch:

jobs:
  pi-gen:
    runs-on: ubuntu-latest
    steps:
      # The action validates custom stages as directories in the workspace,
      # before it clones pi-gen, so ./ninux has to be checked out first
      - uses: actions/checkout@v4

      - uses: usimd/pi-gen-action@v1.10.0
        id: build
        with:
          pi-gen-repository: mikysal78/pi-gen-ninux
          # Default is 'arm64', a branch that does not exist in this repository
          pi-gen-version: master
          # The action overwrites ./config, so every value has to be set here.
          # Keep in sync with ./config, which is what the Jenkins build uses.
          release: bullseye
          image-name: ninuxberry
          stage-list: stage0 stage1 stage2 ./ninux
          # Only the ninux stage exports an image, stage2 would be a duplicate
          export-last-stage-only: true
          verbose-output: true
          enable-noobs: true
          compression: zip
          compression-level: 9
          locale: it_IT.UTF-8
          hostname: ninuxberry
          keyboard-keymap: it
          keyboard-layout: Italiana
          username: ninux
          password: ninux
          enable-ssh: 1
          pubkey-ssh-first-user: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMuoHflKC6z/hH9l5qqinpQ5gNgmFI+r9c8Xu3kHnN9s mikysal78@gmail.com
          wpa-essid: ninux-org
          wpa-password: 'ninux2025'
          wpa-country: IT
          timezone: Europe/Rome

      - run: tree 
      
      - uses: actions/upload-artifact@v4
        with:
          name: pi-gen-image
          path: ${{ steps.build.outputs.image-path }}
          retention-days: 2
      
      - uses: actions/upload-artifact@v4
        with:
          name: pi-gen-noobs-image
          path: ${{ steps.build.outputs.image-noobs-path }}
          retention-days: 2
